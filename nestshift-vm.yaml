architecture: amd64
filename: nestshift-os-vm.img

stages:
  - action: recipe
    recipe: scripts/vm-recipe-base.yaml

  - action: run
    chroot: true
    command: |
      # Install NestShift code into the VM
      mkdir -p /opt/nestshift
      cp -r /nestshift/* /opt/nestshift/
      cd /opt/nestshift
      ./scripts/install.sh
