server {
  listen 8080;

  # NestShift React dashboard (built static files)
  location / {
    root /var/www/nestshift;
    try_files $uri $uri/ /index.html;
  }

  # Proxy to nestshift-api (adjust port to match actual api port)
  location /api/nestshift/ {
    proxy_pass http://localhost:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Proxy to HA WebSocket API
  location /api/ha/ {
    proxy_pass http://localhost:8123/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host localhost:8123;
  }

  # HA WebSocket (for haClient.js)
  location /ws/ha/ {
    proxy_pass http://localhost:8123/api/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}