name: NestShift OS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-python-services:
    name: Python Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r services/api/requirements.txt
          pip install -r services/system-agent/requirements.txt
          pip install -r services/automation-agent/requirements.txt

      - name: Run safety filter tests
        run: pytest tests/test_safety_filter.py -v

      - name: Run drift detector tests
        run: pytest tests/test_drift_detector.py -v

      - name: Run behaviour model tests
        run: pytest tests/test_behaviour_model.py -v

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - run: |
          flake8 services/api/main.py \
            services/brain/main.py \
            services/gpio/main.py \
            services/energy-agent/main.py \
            services/automation-agent/main.py \
            services/system-agent/main.py \
            --max-line-length=100 \
            --ignore=E501,W503

  lint-shell:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n scripts/install.sh
          bash -n scripts/first-run.sh
          bash -n scripts/flash.sh
          bash -n services/mqtt/generate-certs.sh
          echo "All shell scripts pass syntax check"

  build-dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
      - name: Check build output exists
        run: test -d dashboard/dist && echo "Build OK"

  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose \
            -f dev/docker-compose.dev.yml \
            config --quiet && echo "docker-compose.dev.yml valid"