  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: nestshift-zigbee2mqtt
    networks: [nestshift-dev]
    environment:
      - ZIGBEE2MQTT_DATA=/app/data
    volumes:
      - ../services/zigbee/configuration.yaml:/app/data/configuration.yaml
    depends_on:
      - mosquitto
    restart: unless-stopped

  nodered:
    image: nodered/node-red:latest
    container_name: nestshift-nodered
    networks: [nestshift-dev]
    ports:
      - "1880:1880"
    volumes:
      - ../config/nodered:/data/config
      - nodered-data:/data
    restart: unless-stopped